[project]
name = "daechul-recommend"
version = "0.1.0"
description = "대출 추천 시뮬레이터 — 정책대출 + 은행대출 최적 조합 계산"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "google-genai>=1.47.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.11.0",
    "psycopg[binary]>=3.2.12",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
]
